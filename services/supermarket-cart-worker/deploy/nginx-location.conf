# Dedicated virtual host for cart.conviveconnect.com
server {
    listen 80;
    listen [::]:80;
    server_name cart.conviveconnect.com;

    access_log /var/log/nginx/cart_conviveconnect_access.log;
    error_log /var/log/nginx/cart_conviveconnect_error.log;

    client_max_body_size 256k;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:4387;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}

