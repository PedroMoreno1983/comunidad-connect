name: Secret scan

# Corre gitleaks solo sobre los commits nuevos de cada push o PR, para que
# los secretos viejos del historial (ya rotados o pendientes de rotar) no
# hagan fallar el CI. Usa el binario oficial con checksum verificado, sin la
# action gitleaks/gitleaks-action (no requiere GITLEAKS_LICENSE).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (commits nuevos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Calcular rango de commits
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "$zero" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${HEAD_SHA}"
          else
            # Rama nueva (o before inalcanzable): solo lo que no está en la rama por defecto.
            git fetch --no-tags origin "${DEFAULT_BRANCH}" >/dev/null 2>&1 || true
            if git rev-parse --verify -q "origin/${DEFAULT_BRANCH}" >/dev/null; then
              range="origin/${DEFAULT_BRANCH}..${HEAD_SHA}"
            else
              range="${HEAD_SHA}^!"
            fi
          fi
          echo "Rango: ${range} ($(git rev-list --count ${range} 2>/dev/null || echo '?') commits)"
          echo "range=${range}" >> "$GITHUB_OUTPUT"

      - name: gitleaks git (solo commits nuevos)
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          /tmp/gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="${RANGE}" \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1
